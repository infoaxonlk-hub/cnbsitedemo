<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#063948">
    <title>C&B Water Treatment | Interactive Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            font-family: 'DM Sans', sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --navy: #052f40;
            --dark: #062e40;
            --ink: #0d3445;
            --teal: #0d8e95;
            --aqua: #9af2d8;
            --muted: #6c818a;
            --line: #e4ecee;
            --paper: #fff;
            --cream: #f4f8f7;
            --radius: 18px;
            --shadow: 0 24px 70px rgba(6, 49, 61, .09)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: #fff;
            color: var(--ink)
        }

        h1,
        h2,
        h3,
        h4,
        p {
            margin-top: 0
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -.05em
        }

        p {
            line-height: 1.7
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .65
        }

        img {
            max-width: 100%;
            display: block
        }

        svg {
            flex-shrink: 0
        }

        ::selection {
            background: #a5f3dc;
            color: #073f48
        }

        .container {
            width: min(1248px, calc(100% - 88px));
            margin: 0 auto
        }

        .section {
            padding: 110px 0
        }

        .section-mild {
            background: #f5f8f8
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .2em;
            color: #15878b;
            display: inline-flex;
            align-items: center;
            gap: 10px
        }

        .eyebrow-line {
            width: 22px;
            height: 2px;
            border-radius: 2px;
            background: currentColor
        }

        .eyebrow-light {
            color: #9cefd9
        }

        .accent-text {
            color: #008e8d
        }

        .btn {
            border: 0;
            border-radius: 9px;
            min-height: 49px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 14px 23px;
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
            transition: transform .25s, background .25s, box-shadow .25s
        }

        .btn:hover {
            transform: translateY(-2px)
        }

        .btn-aqua {
            background: var(--aqua);
            color: #073b42;
            box-shadow: 0 12px 28px rgba(101, 222, 201, .16)
        }

        .btn-aqua:hover {
            background: #b0ffe7
        }

        .btn-dark {
            background: #073949;
            color: #fff
        }

        .btn-dark:hover {
            background: #0b6370
        }

        .btn-outline-white {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .44)
        }

        .btn-outline-white:hover {
            background: rgba(255, 255, 255, .08)
        }

        .btn-light {
            background: #f0f5f5;
            color: #244955
        }

        .btn-outline-sm {
            min-height: 38px;
            border: 1px solid #dbe7e8;
            border-radius: 8px;
            background: white;
            color: #194455;
            padding: 9px 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 800;
            transition: .2s
        }

        .btn-outline-sm:hover {
            background: #f3fafa;
            border-color: #9bdad4
        }

        .text-link,
        .section-action {
            border: 0;
            background: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #067e86;
            font-weight: 800;
            font-size: 12px;
            transition: gap .2s
        }

        .text-link:hover,
        .section-action:hover {
            gap: 13px
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 30px;
            margin-bottom: 36px
        }

        .section-heading h2 {
            font-size: clamp(31px, 3.5vw, 48px);
            line-height: 1.19;
            letter-spacing: -.06em;
            max-width: 690px;
            margin: 16px 0 12px;
            font-weight: 800
        }

        .section-heading p {
            color: #667d86;
            font-size: 14px;
            max-width: 640px;
            line-height: 1.8;
            margin: 0
        }

        .section-heading.center {
            text-align: center;
            justify-content: center
        }

        .section-heading.center .eyebrow {
            justify-content: center
        }

        /* Header */
        .topline {
            height: 35px;
            background: #073340;
            color: #bee5e3
        }

        .top-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .15em
        }

        .top-inner>span {
            display: inline-flex;
            align-items: center;
            gap: 10px
        }

        .top-hide {
            color: #a8c9cc;
            font-weight: 500;
            letter-spacing: .04em
        }

        .top-dot,
        .signal span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9aedda;
            display: inline-block;
            box-shadow: 0 0 0 3px rgba(155, 237, 218, .13)
        }

        .header {
            height: 80px;
            position: relative;
            z-index: 10;
            background: #fff;
            box-shadow: 0 1px 0 #edf1f2
        }

        .header-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #063a49;
            white-space: nowrap
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(145deg, #005d67, #073945);
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #9ef6db;
            box-shadow: 0 9px 22px rgba(6, 79, 83, .12)
        }

        .brand-icon svg {
            width: 32px
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            gap: 0
        }

        .brand-copy strong {
            font-family: 'Manrope';
            font-size: 29px;
            letter-spacing: -.07em;
            line-height: 1.07;
            font-weight: 800
        }

        .brand-copy small {
            font-size: 8.5px;
            letter-spacing: .17em;
            font-weight: 900
        }

        .brand-light {
            color: #fff
        }

        .brand-light .brand-icon {
            background: #165969;
            box-shadow: none
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 29px
        }

        .main-nav>a {
            font-size: 11.5px;
            font-weight: 800;
            color: #405963;
            position: relative;
            transition: color .2s
        }

        .main-nav>a:hover,
        .main-nav>a.nav-active {
            color: #018f95
        }

        .main-nav>a.nav-active:after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 35%;
            width: 30%;
            height: 2px;
            background: #00a99d
        }

        .main-nav .mobile-admin-link {
            display: none
        }

        .header-contact {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #073f4f;
            border: 0;
            border-radius: 8px;
            color: #fff;
            padding: 13px 17px;
            font-size: 11px;
            font-weight: 800;
            transition: background .2s
        }

        .header-contact:hover {
            background: #007783
        }

        .header-contact svg:first-child {
            color: #9ef1d7
        }

        .mobile-menu {
            display: none;
            background: none;
            border: 0;
            color: #103a45
        }

        /* Hero */
        .hero {
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at 75% 20%, #12677b 0%, #074b61 33%, #032c41 78%);
            color: white;
            min-height: 595px
        }

        .hero:before {
            content: "";
            position: absolute;
            inset: -20% -15% -20% 40%;
            background: repeating-radial-gradient(ellipse at center, transparent 0 62px, rgba(160, 247, 230, .035) 63px 64px, transparent 65px 110px);
            transform: rotate(-25deg)
        }

        .hero-background-texture {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(90deg, rgba(123, 219, 214, .027) 1px, transparent 1px), linear-gradient(rgba(123, 219, 214, .027) 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: linear-gradient(90deg, transparent, black)
        }

        .hero-inner {
            position: relative;
            display: grid;
            grid-template-columns: 1.03fr .97fr;
            gap: 45px;
            align-items: center;
            min-height: 588px;
            padding: 62px 0 83px
        }

        .hero-copy {
            z-index: 2;
            max-width: 585px
        }

        .hero-kicker {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: .16em;
            color: #b6e9e3;
            margin-bottom: 27px
        }

        .signal {
            display: inline-grid;
            place-items: center;
            border: 1px solid #39a2a7;
            border-radius: 50%;
            width: 18px;
            height: 18px
        }

        .signal span {
            width: 6px;
            height: 6px
        }

        .hero h1 {
            font-weight: 800;
            font-size: clamp(45px, 4.9vw, 72px);
            line-height: 1.12;
            letter-spacing: -.075em;
            margin: 0 0 24px
        }

        .hero h1 em {
            font-style: normal;
            color: #9af1d5
        }

        .hero-copy>p {
            color: #c4d8e0;
            font-size: 14.5px;
            max-width: 495px;
            line-height: 1.9;
            margin: 0 0 31px
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .hero-notes {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 41px;
            color: #d4eae9;
            font-size: 10px;
            font-weight: 700
        }

        .hero-notes>div {
            display: inline-flex;
            align-items: center;
            gap: 8px
        }

        .hero-notes span {
            width: 19px;
            height: 19px;
            border: 1px solid #75a6aa;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #b8ebd8
        }

        .hero-visual {
            min-height: 480px;
            position: relative;
            display: grid;
            place-items: center
        }

        .hero-photo {
            position: relative;
            width: 92%;
            height: 425px;
            border-radius: 50% 50% 42% 44%;
            overflow: hidden;
            box-shadow: 0 25px 75px #062e414d;
            border: 1px solid #4e89977a;
            background: radial-gradient(circle at 62% 18%, #4d99a2, #17485c 65%, #103f53)
        }

        .hero-photo-image {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(3, 45, 61, .04), rgba(0, 42, 52, .7)), url('https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=1000&q=85') center/cover;
            opacity: .25
        }

        .hero-photo-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 40% 25%, #60c7b41f, transparent 65%)
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(188, 255, 240, .12);
            border-radius: 50%;
            width: 530px;
            height: 530px
        }

        .orbit-two {
            width: 610px;
            height: 610px;
            border-style: dashed;
            opacity: .6
        }

        .hero-system {
            position: absolute;
            inset: 25% 10% 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(10px 20px 12px #02252d9c)
        }

        .hero-system-rack {
            position: relative;
            width: 65%;
            height: 68%;
            border: 12px solid #cfdee4;
            border-left-width: 17px;
            border-right-width: 17px;
            background: linear-gradient(125deg, #557a8f, #2d566d 55%, #1b4356);
            border-radius: 10px;
            box-shadow: inset -18px 0 20px #061b2a8c, 3px 4px 1px #6b96a5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-content: space-evenly;
            padding: 14px 18px;
            gap: 10px 12px;
            transform: perspective(850px) rotateY(-10deg) rotateZ(-4deg)
        }

        .hero-system-rack span {
            border: 5px solid #c3dde3;
            border-radius: 25px;
            background: linear-gradient(0deg, #e1edef, #7694a1 28%, #f5f7f5 55%, #8caab8);
            box-shadow: inset 5px 0 6px #66889a, 0 8px 7px #0b2c3b80
        }

        .hero-system-rack:after {
            content: "";
            position: absolute;
            inset: auto -20px -15px;
            height: 15px;
            background: #b2cbd1;
            border-radius: 6px
        }

        .hero-system-tank {
            width: 19%;
            height: 58%;
            border-radius: 40px 40px 15px 15px;
            background: linear-gradient(90deg, #446c7f, #d0e1e6 30%, #e0e9eb 58%, #47687c);
            border: 5px solid #b3c9ce;
            margin-left: -10px;
            margin-top: 45px;
            box-shadow: inset -8px 0 10px #174254
        }

        .hero-system-meter {
            position: absolute;
            border: 7px solid #ebf1ee;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            right: 15%;
            top: 22%;
            background: radial-gradient(circle, #2e9ba1 0 22%, #ecf1ed 23% 26%, #546e77 28%);
            box-shadow: 0 8px 14px #06232f91
        }

        .float-badge {
            position: absolute;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 11px;
            background: #fffffff2;
            color: #184756;
            border-radius: 13px;
            padding: 13px 16px;
            box-shadow: 0 14px 42px #002e3c59;
            min-width: 197px
        }

        .float-badge strong {
            display: block;
            font-size: 12px;
            letter-spacing: -.02em
        }

        .float-badge small {
            display: block;
            font-size: 9px;
            color: #71919a;
            margin-top: 3px
        }

        .float-badge-top {
            top: 57px;
            left: -16px
        }

        .float-badge-bottom {
            right: -20px;
            bottom: 61px
        }

        .icon-circle,
        .badge-circle {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #e4fbf6;
            color: #11888b;
            display: grid;
            place-items: center
        }

        .badge-circle {
            border-radius: 50%;
            background: #0e8c83;
            color: white
        }

        .hero-bottom-wave {
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 35px;
            background: #fff;
            clip-path: polygon(0 90%, 35% 100%, 70% 60%, 100% 20%, 100% 100%, 0 100%)
        }

        /* Trust and category cards */
        .trust-strip {
            padding: 24px 0;
            border-bottom: 1px solid #e8f0f0
        }

        .trust-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            color: #647b84
        }

        .trust-inner>div:first-child {
            font-size: 11px;
            font-weight: 700;
            max-width: 160px;
            line-height: 1.4
        }

        .trust-inner>div:not(:first-child) {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .05em;
            color: #59717b
        }

        .trust-inner svg {
            width: 24px;
            height: 24px;
            color: #107c86;
            stroke-width: 1.5
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px
        }

        .category-card {
            position: relative;
            min-height: 287px;
            padding: 25px 23px;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .25s, box-shadow .25s;
            border: 1px solid rgba(13, 75, 77, .02)
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 45px rgba(4, 59, 61, .1)
        }

        .category-mint {
            background: #e5f4ed
        }

        .category-blue {
            background: #e1edf5
        }

        .category-sand {
            background: #f3ede2
        }

        .category-lavender {
            background: #edebf6
        }

        .category-card:before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid #87bdbd55;
            border-radius: 50%;
            right: -90px;
            top: 34px;
            box-shadow: 0 0 0 25px #ffffff24, 0 0 0 50px #ffffff1b
        }

        .category-count {
            font-size: 11px;
            color: #4c8789;
            font-weight: 800
        }

        .category-icon {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background: #ffffff9c;
            color: #0e6870;
            position: relative
        }

        .category-bottom {
            position: relative
        }

        .category-bottom small {
            font-size: 10px;
            font-weight: 800;
            color: #44888c
        }

        .category-bottom h3 {
            font-size: 19px;
            letter-spacing: -.05em;
            margin: 7px 0
        }

        .category-bottom>span {
            font-size: 11.5px;
            line-height: 1.7;
            color: #5a7580;
            display: block;
            max-width: 200px
        }

        .category-arrow {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border: 1px solid #aac9c95c;
            border-radius: 50%;
            color: #0c656d;
            transition: .2s
        }

        .category-card:hover .category-arrow {
            background: #fff;
            transform: rotate(45deg)
        }

        /* Products */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 23px
        }

        .product-card {
            border-radius: 13px;
            background: white;
            overflow: hidden;
            box-shadow: 0 0 0 1px #edf1f1;
            transition: transform .25s, box-shadow .25s
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(7, 58, 70, .1)
        }

        .product-image {
            position: relative;
            display: block;
            width: 100%;
            height: 264px;
            overflow: hidden;
            border: 0;
            background: #edf5f6;
            padding: 0;
            text-align: left
        }

        .product-image>.product-img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .product-tag {
            position: absolute;
            left: 17px;
            top: 17px;
            border-radius: 5px;
            background: white;
            color: #186c72;
            padding: 7px 10px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .04em;
            box-shadow: 0 4px 14px #0c333512
        }

        .product-image-arrow {
            position: absolute;
            right: 17px;
            bottom: 17px;
            width: 37px;
            height: 37px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: white;
            color: #0a5966;
            opacity: 0;
            transform: translateY(8px);
            transition: .2s
        }

        .product-card:hover .product-image-arrow {
            opacity: 1;
            transform: translateY(0)
        }

        .product-card-body {
            padding: 24px 23px 19px
        }

        .product-category,
        .project-category {
            font-size: 9px;
            font-weight: 800;
            color: #149297;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        .product-name {
            display: block;
            text-align: left;
            background: none;
            border: 0;
            padding: 0;
            color: #103744;
            font-size: 17px;
            font-family: Manrope;
            font-weight: 800;
            letter-spacing: -.05em;
            margin: 9px 0;
            min-height: 25px
        }

        .product-name:hover {
            color: #02878f
        }

        .product-card-body>p {
            font-size: 11.5px;
            color: #80939a;
            line-height: 1.65;
            margin: 0;
            min-height: 37px
        }

        .product-card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #ecf1f1
        }

        .mini-wa {
            border: 0;
            background: #e9f7f2;
            color: #0b8d87;
            width: 37px;
            height: 37px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            transition: .2s
        }

        .mini-wa:hover {
            background: #119588;
            color: white
        }

        /* Illustrations */
        .product-illustration {
            height: 100%;
            width: 100%;
            min-height: 150px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at 55% 45%, #e9f8f8, #dcebf0 69%, #d0e3ea);
            display: grid;
            place-items: center
        }

            background: #0fa99b

        const area = (label, name, val = '', rows = 4) => `<label class="field"><span class="field-label">${label}</span><textarea name="${name}" rows="${rows}">${escapeHTML(val)}</textarea></label>`;
        const choices = (label, name, selected, values) => `<label class="field"><span class="field-label">${label}</span><select name="${name}">${values.map(([v, t]) => `<option value="${attr(v)}" ${v === selected ? 'selected' : ''}>${escapeHTML(t)}</option>`).join('')}</select></label>`;
        function mediaEditor() {return `<div class="media-editor"><span class="field-label">Photos ${editKind === 'project' ? '& videos' : ''}</span><div class="media-editor-grid">${(draft.media || []).map((m, i) => `<div class="media-edit-item">${m.kind === 'video' ? '<div class="video-edit-preview">▶<small>Video</small></div>' : mImg(m, m.name)}<button data-remove-media="${attr(m.id)}">✕</button>${i === 0 ? '<span>Cover</span>' : ''}</div>`).join('')}<label class="upload-target"><input id="media-file-input" type="file" accept="${editKind === 'product' ? 'image/*' : 'image/*,video/*'}" multiple><span style="font-size:24px">⇧</span><b>Upload files</b><small>Images up to 10 MB • Videos up to 60 MB</small></label></div><div class="url-add"><select id="new-media-kind"><option value="image">Image URL</option>${editKind === 'project' ? '<option value="video">Video URL</option>' : ''}</select><input type="url" id="new-media-url" placeholder="https://..."><button class="btn btn-outline-sm" data-action="add-media-url">+ Add</button></div><small class="field-help">Stored in this browser only. The first image is the gallery cover.</small></div>`}
        function editForm() {const p = draft; const isProduct = editKind === 'product'; return `<div class="admin-content"><div class="admin-heading"><div><button data-action="back-edit" class="back-link">← Back to ${isProduct ? 'products' : 'projects'}</button><h1>${editId === 'new' ? 'Add new' : 'Edit'} ${isProduct ? 'product' : 'project'}</h1><p>Add the details customers will see in the public website.</p></div></div><form id="edit-form" class="admin-editor"><div class="editor-main"><div class="editor-panel"><h3>${isProduct ? 'Product information' : 'Project details'}</h3>${field(isProduct ? 'Product name *' : 'Project title *', 'name', p.name || p.title, 'Enter title')}${choices('Category', 'categoryId', p.categoryId, state.categories.map(c => [c.id, c.name]))}${isProduct ? `${field('Short subtitle', 'subtitle', p.subtitle, 'A short product tagline')}${area('Full description', 'description', p.description)}${area('Key features (one per line)', 'specs', (p.specs || []).join('\n'))}${field('Badge', 'badge', p.badge, 'Popular, New...')}${choices('Fallback equipment illustration', 'visual', p.visual || 'ro', ['ro', 'tanks', 'plant', 'industrial', 'uv', 'cartridges'].map(v => [v, v]))}` : `${field('Location', 'location', p.location, 'City, Sri Lanka')}${field('Year', 'year', p.year, '2026')}${area('Short summary', 'summary', p.summary, 2)}${area('Project story', 'description', p.description, 6)}${field('Services provided', 'services', p.services, 'Installation • Maintenance')}`}</div><div class="editor-panel"><h3>${isProduct ? 'Product imagery' : 'Project gallery'}</h3>${mediaEditor()}</div></div><aside class="editor-side"><div class="editor-panel"><h3>Publishing</h3><label class="admin-check"><input name="published" type="checkbox" ${p.published ? 'checked' : ''}><span><b>Published</b><small>Visible to customers</small></span></label><label class="admin-check"><input name="featured" type="checkbox" ${p.featured ? 'checked' : ''}><span><b>Featured</b><small>Highlight on homepage</small></span></label></div><div class="editor-panel editor-save"><button class="btn btn-dark" type="submit">✓ Save ${isProduct ? 'product' : 'project'}</button><button class="btn btn-light" type="button" data-action="back-edit">Cancel</button></div></aside></form></div>`}
        function categories() {return `<div class="admin-content"><div class="admin-heading"><div>${eyebrow('KEEP THINGS ORGANIZED')}<h1>Categories</h1><p>Define your own domestic, commercial or other product types.</p></div></div><div class="category-admin-layout"><div class="editor-panel"><h3>Category details</h3><form id="category-form">${field('Category name *', 'name', draft?.name || '', 'e.g. Commercial Plants')}${field('Short subtitle', 'subtitle', draft?.subtitle || '', 'For businesses')}${area('Description', 'description', draft?.description || '', 3)}${choices('Icon', 'icon', draft?.icon || 'home', [['home', 'Home'], ['building', 'Building'], ['factory', 'Factory'], ['settings', 'Gear']])}${choices('Color', 'tint', draft?.tint || 'mint', [['mint', 'Mint'], ['blue', 'Blue'], ['sand', 'Sand'], ['lavender', 'Lavender']])}<button type="submit" class="btn btn-dark">Save category</button></form></div><div class="category-admin-list">${state.categories.map(c => `<article class="category-admin-card"><div class="category-icon category-${attr(c.tint)}" style="font-size:25px">${iconFor[c.icon] || '⚙'}</div><div><h3>${escapeHTML(c.name)}</h3><p>${escapeHTML(c.description)}</p><small>${state.products.filter(p => p.categoryId === c.id).length} products · ${state.projects.filter(p => p.categoryId === c.id).length} projects</small></div><div class="category-admin-buttons"><button data-edit="category" data-id="${attr(c.id)}">✎</button><button class="delete" data-delete="category" data-id="${attr(c.id)}">✕</button></div></article>`).join('')}</div></div></div>`}
        function settings() {const s = state.settings; return `<div class="admin-content"><div class="admin-heading"><div>${eyebrow('MAKE IT YOURS')}<h1>Website settings</h1><p>Control your business details and where WhatsApp orders go.</p></div></div><form id="settings-form" class="settings-layout"><div class="settings-main"><div class="editor-panel"><h3>☏ WhatsApp orders</h3><p class="panel-help">The customer Order button generates a message to this number.</p>${field('WhatsApp number (country code required)', 'whatsapp', s.whatsapp, '9477XXXXXXX')}<small class="field-help">Enter only digits, no + symbol or spaces, using the real business number.</small><div class="example-order"><span>☏ Example enquiry message</span><p>Hello C&B Water Treatment! I’m interested in your 7-Stage RO Water Purifier. Could you please share more details?</p></div></div><div class="editor-panel"><h3>Business details</h3>${field('Phone', 'phone', s.phone, '+94...')}${field('Email', 'email', s.email, 'info@company.com', 'email')}${field('Address', 'address', s.address, 'Sri Lanka')}${field('Working hours', 'hours', s.hours)}</div><div class="editor-panel"><h3>Social media</h3>${['facebook', 'instagram', 'youtube', 'tiktok'].map(x => field(x[0].toUpperCase() + x.slice(1) + ' URL', x, s[x], 'https://...', 'url')).join('')}</div><div class="editor-panel"><h3>Homepage text</h3>${field('Hero headline', 'heroTitle', s.heroTitle)}${area('Hero description', 'heroDescription', s.heroDescription)}</div></div><aside class="settings-side"><div class="editor-panel"><h3>Save settings</h3><p>Changes immediately affect this browser's public preview.</p><button class="btn btn-dark" type="submit">✓ Save settings</button><a href="#home" class="admin-preview-link">Preview website ↗</a></div>${warn}</aside></form></div>`}
        function adminPage() {if (!admin) return adminLogin(); let content = editKind ? editForm() : adminTab === 'overview' ? adminOverview() : adminTab === 'products' ? adminProducts() : adminTab === 'projects' ? adminProjects() : adminTab === 'categories' ? categories() : settings(); return adminShell(content)}
        function render() {const raw = location.hash.slice(1) || 'home'; const page = raw.split('?')[0] || 'home'; document.title = 'C&B Water Treatment | Interactive Prototype'; root.innerHTML = page === 'admin' ? adminPage() : `${pubHeader(page)}<main>${({home, products, projects, services, about, contact})[page]?.() || home()}</main>${footer()}${modalHtml()}`; hydrate();}
        function navigatePage() {const raw = location.hash.slice(1).split('?')[0]; if (raw !== 'products' && raw !== 'projects') {categoryFilter = 'all'; searchText = ''} mobileNav = false; modal = null; mediaIndex = 0; render(); window.scrollTo(0, 0)}
        window.addEventListener('hashchange', navigatePage);
        function openEditor(kind, aid) {editKind = kind; editId = aid; const old = (kind === 'product' ? state.products : state.projects).find(x => x.id === aid); draft = old ? structuredClone(old) : kind === 'product' ? {id: id(), name: '', categoryId: state.categories[0]?.id, subtitle: '', description: '', specs: [], badge: '', visual: 'ro', featured: false, published: true, media: []} : {id: id(), title: '', categoryId: state.categories[0]?.id, location: 'Sri Lanka', year: '2026', summary: '', description: '', services: '', featured: false, published: true, media: []}; render(); window.scrollTo(0, 0)}
        function collectDraft() {const f = document.getElementById('edit-form'); if (!f || !draft) return; const d = new FormData(f); const keys = editKind === 'product' ? ['name', 'categoryId', 'subtitle', 'description', 'badge', 'visual'] : ['name', 'categoryId', 'location', 'year', 'summary', 'description', 'services']; for (const k of keys) {if (k === 'name' && editKind === 'project') draft.title = d.get(k) || ''; else draft[k] = d.get(k) || ''} if (editKind === 'product') draft.specs = String(d.get('specs') || '').split('\n').map(s => s.trim()).filter(Boolean); draft.published = d.has('published'); draft.featured = d.has('featured')}
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-action],[data-order],[data-product],[data-project],[data-tab],[data-edit],[data-toggle],[data-delete],[data-filter],[data-project-filter],[data-media-index],[data-remove-media]'); if (!el) return;
            if (el.dataset.order) {e.preventDefault(); order(el.dataset.order, el.dataset.name || ''); return }
            if (el.dataset.product) {modal = {kind: 'product', id: el.dataset.product}; mediaIndex = 0; render(); return }
            if (el.dataset.project) {modal = {kind: 'project', id: el.dataset.project}; mediaIndex = 0; render(); return }
            if (el.dataset.mediaIndex !== undefined) {mediaIndex = Number(el.dataset.mediaIndex); render(); return }
            if (el.dataset.filter) {categoryFilter = el.dataset.filter; searchText = ''; location.hash = `products?cat=${encodeURIComponent(categoryFilter)}`; render(); return }
            if (el.dataset.projectFilter) {categoryFilter = el.dataset.projectFilter; render(); return }
            if (el.dataset.tab) {adminTab = el.dataset.tab; editKind = ''; draft = null; editId = ''; if (el.dataset.new === 'yes') openEditor(adminTab === 'products' ? 'product' : 'project', 'new'); else render(); window.scrollTo(0, 0); return }
            if (el.dataset.edit) {if (el.dataset.edit === 'category') {editId = el.dataset.id; draft = structuredClone(state.categories.find(c => c.id === editId)); render(); return } openEditor(el.dataset.edit, el.dataset.id); return }
            if (el.dataset.toggle) {const xs = el.dataset.toggle === 'product' ? state.products : state.projects; const item = xs.find(p => p.id === el.dataset.id); if (item) {item.published = !item.published; save(); render()} return }
            if (el.dataset.delete) {const typ = el.dataset.delete, idval = el.dataset.id; if (typ === 'category' && (state.products.some(p => p.categoryId === idval) || state.projects.some(p => p.categoryId === idval))) {notice('Move or delete items in this category first.'); return } if (!confirm(`Delete this ${typ}?`)) return; const key = typ === 'product' ? 'products' : typ === 'project' ? 'projects' : 'categories'; state[key] = state[key].filter(x => x.id !== idval); if (draft?.id === idval) {draft = null; editId = ''} save(); render(); notice('Deleted.'); return }
            if (el.dataset.removeMedia) {collectDraft(); const rm = draft.media.find(m => m.id === el.dataset.removeMedia); draft.media = draft.media.filter(m => m.id !== el.dataset.removeMedia); if (rm?.source === 'upload') deleteFile(rm.fileId); render(); return }
            const action = el.dataset.action;
            if (action === 'mobile') {mobileNav = !mobileNav; render()}
            else if (action === 'close-modal') {if (e.target.closest('.dialog') && !e.target.closest('.dialog-close')) return; modal = null; render()}
            else if (action === 'logout') {admin = false; sessionStorage.removeItem('cb-water-preview-admin'); editKind = ''; render()}
            else if (action === 'reset') {if (confirm('Reset all product, category, project and settings demo data?')) {state = structuredClone(DEFAULT); save(); editKind = ''; draft = null; adminTab = 'overview'; render(); notice('Sample data reset.')} }
            else if (action === 'back-edit') {editKind = ''; draft = null; render()}
            else if (action === 'add-media-url') {e.preventDefault(); const f = document.getElementById('new-media-url'), url = f.value.trim(); if (!/^https?:\/\//.test(url)) {notice('Enter a full URL beginning with https://'); return } collectDraft(); draft.media.push({id: id(), kind: document.getElementById('new-media-kind').value, source: 'url', url, name: 'Linked media'}); render()}
            else if (action === 'side') {document.querySelector('.standalone-sidebar')?.classList.toggle('shown')}
        });
        document.addEventListener('change', async e => {if (e.target.id !== 'media-file-input') return; const files = [...e.target.files]; if (!files.length) return; collectDraft(); let n = 0; for (const file of files) {const video = file.type.startsWith('video/'); if (!file.type.startsWith('image/') && !video) {notice('Unsupported file format.'); continue} if (video && editKind !== 'project') {notice('Only images allowed for products.'); continue} if (file.size > (video ? 60 : 10) * 1024 * 1024) {notice(`${file.name} exceeds the ${video ? '60' : '10'}MB limit.`); continue} try {const fileId = await storeFile(file); draft.media.push({id: id(), kind: video ? 'video' : 'image', source: 'upload', fileId, name: file.name}); n++} catch {notice('Browser media storage failed. Check free space.')} } render(); if (n) notice(`${n} file(s) added to the gallery. Remember to Save.`)});
        document.addEventListener('input', e => {if (e.target.id === 'product-search') {const pos = e.target.selectionStart || 0; searchText = e.target.value; render(); const elm = document.getElementById('product-search'); elm?.focus(); elm?.setSelectionRange(pos, pos)} });
        document.addEventListener('submit', e => {
            const form = e.target; if (!['login-form', 'edit-form', 'category-form', 'settings-form'].includes(form.id)) return; e.preventDefault(); const f = new FormData(form);
            if (form.id === 'login-form') {if (f.get('pin') === '1234') {admin = true; sessionStorage.setItem('cb-water-preview-admin', '1'); render(); notice('Demo dashboard unlocked.')} else notice('Incorrect demo PIN. Try 1234.'); return }
            if (form.id === 'edit-form') {collectDraft(); if (editKind === 'product' && !draft.name.trim()) {notice('Enter a product name.'); return } if (editKind === 'project' && !draft.title.trim()) {notice('Enter a project title.'); return } const key = editKind === 'product' ? 'products' : 'projects'; const prev = state[key].findIndex(x => x.id === draft.id); if (prev < 0) state[key].unshift(draft); else state[key][prev] = draft; save(); editKind = ''; draft = null; render(); notice('Saved. Open the public page to see your update.'); return }
            if (form.id === 'category-form') {const name = String(f.get('name') || '').trim(); if (!name) {notice('Category name is required.'); return } const obj = {id: editId || id(), name, subtitle: String(f.get('subtitle') || ''), description: String(f.get('description') || ''), icon: String(f.get('icon')), tint: String(f.get('tint'))}; if (state.categories.some(c => c.id !== obj.id && c.name.toLowerCase() === name.toLowerCase())) {notice('This category name is already in use.'); return } const ix = state.categories.findIndex(c => c.id === obj.id); if (ix < 0) state.categories.push(obj); else state.categories[ix] = obj; draft = null; editId = ''; save(); render(); notice('Category saved.'); return }
            if (form.id === 'settings-form') {let whatsapp = String(f.get('whatsapp') || '').trim(); if (whatsapp && !/^\d{8,15}$/.test(whatsapp.replace(/\D/g, ''))) {notice('WhatsApp number must include country code (8–15 digits).'); return } const obj = {}; for (const [k, v] of f.entries()) {if (['facebook', 'instagram', 'youtube', 'tiktok'].includes(k) && v && !/^https?:\/\//.test(v)) {notice('Social links must start with https://'); return } obj[k] = String(v)} state.settings = {...state.settings, ...obj}; save(); render(); notice('Website settings saved.'); return }
        });
        render();
    </script>
</body>
